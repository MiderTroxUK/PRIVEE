    <text x="362" y="527" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1E4258">
      <tspan x="362" dy="0">&lt;client_id&gt;.sqlite</tspan>
      <tspan x="362" dy="17" font-weight="400" fill="#6B7A85">× N nœuds</tspan>
