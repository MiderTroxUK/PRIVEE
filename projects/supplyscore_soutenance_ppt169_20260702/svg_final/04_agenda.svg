    <text x="160" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6B7A85">Hypothèses de modélisation, architecture logicielle, panorama fonctionnel</text>
    <text x="1180" y="206" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#9AA5AC">P05-P07</text>
    <line x1="56" y1="272" x2="1224" y2="272" stroke="#D8DEE3" stroke-width="1"/>
  </g>

