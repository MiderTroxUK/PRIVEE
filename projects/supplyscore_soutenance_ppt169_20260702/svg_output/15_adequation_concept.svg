<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="p15-header">
    <text x="56" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6B7A85">PARTIE II · DEEP DIVE 6/6 · ADÉQUATION</text>
    <text x="54" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#1E4258">Sous-déclarer coûte plus cher que paniquer</text>
    <rect x="56" y="118" width="64" height="4" fill="#2C5F7C"/>
  </g>

  <g id="p15-definitions">
    <use data-icon="tabler-outline/trending-up" x="76" y="164" width="22" height="22" fill="#B06000" stroke-width="2"/>
    <text x="106" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#22313A">Fausse urgence <tspan font-weight="700" font-family="Consolas, 'Courier New', monospace">F = [Ud − Ur]₊</tspan> (panique)</text>
    <use data-icon="tabler-outline/trending-down" x="76" y="200" width="22" height="22" fill="#B3261E" stroke-width="2"/>
    <text x="106" y="217" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#22313A">Risque caché <tspan font-weight="700" font-family="Consolas, 'Courier New', monospace">H = [Ur − Ud]₊</tspan> (silence)</text>

    <rect x="76" y="300" width="250" height="112" fill="#F4F6F8" stroke="#B3261E" stroke-width="2"/>
    <text x="96" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6B7A85">λ_under</text>
    <text x="96" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#B3261E">2.25</text>
    <text x="96" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#22313A">pénalité · risque caché</text>

    <rect x="346" y="300" width="250" height="112" fill="#F4F6F8" stroke="#D8DEE3" stroke-width="2"/>
    <text x="366" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6B7A85">λ_over</text>
    <text x="366" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#6B7A85">1.00</text>
    <text x="366" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#22313A">pénalité · fausse urgence</text>

    <rect x="76" y="440" width="520" height="76" fill="#FFFFFF" stroke="#D8DEE3"/>
    <text x="96" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#22313A">
      <tspan font-weight="700" fill="#2C5F7C">α = 0.88</tspan> : courbure psychophysique, sensibilité</text>
    <text x="96" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#22313A">décroissante aux erreurs extrêmes (Prospect Theory)</text>

    <text x="76" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9AA5AC">Kahneman &amp; Tversky (1979), «&#160;Prospect Theory&#160;», Econometrica</text>
  </g>

  <g id="p15-formulas">
    <text x="650" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6B7A85">Pénalité asymétrique</text>
    <image href="../images/f10_adequation_penalty.png" x="650" y="184" width="480" height="35" preserveAspectRatio="xMidYMid meet"/>

    <text x="650" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6B7A85">Score d'adéquation normalisé</text>
    <image href="../images/f11_adequation_score.png" x="650" y="278" width="480" height="77" preserveAspectRatio="xMidYMid meet"/>

    <text x="650" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#22313A">
      <tspan x="650" dy="0">A ∈ [0, 100] : <tspan font-weight="700" fill="#1D7A3E">100</tspan> = alignement parfait,</tspan>
      <tspan x="650" dy="28"><tspan font-weight="700" fill="#B3261E">0</tspan> = désalignement total.</tspan>
    </text>

    <rect x="650" y="470" width="480" height="90" fill="#F4F6F8" stroke="#D8DEE3"/>
    <text x="670" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E4258">Gouvernance</text>
    <text x="670" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#22313A">Paniquer gaspille du transport premium ;</text>
    <text x="670" y="544" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#22313A">sous-déclarer fait rater une ligne d'arrêt.</text>
  </g>

  <g id="p15-citation">
    <text x="650" y="583" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9AA5AC">Réf. : Kim, Tong &amp; Peden (2020), Management Science · asymétrie sous-triage / sur-triage</text>
  </g>

