<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect id="bg-accent-bar" x="0" y="0" width="10" height="720" fill="#2C5F7C"/>

  <g id="cover-kicker">
    <text x="100" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2" fill="#6B7A85">SOUTENANCE DE THÈSE · GÉNIE INDUSTRIEL &amp; SUPPLY CHAIN</text>
  </g>

  <g id="cover-title">
    <text x="98" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="96" font-weight="800" fill="#1E4258">SupplyScore</text>
    <text x="100" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600" fill="#2C5F7C">
      <tspan x="100" dy="0">Aligner la perception subjective de l'urgence</tspan>
      <tspan x="100" dy="42">et la réalité physique des chaînes logistiques</tspan>
    </text>
  </g>

  <rect id="cover-rule" x="100" y="352" width="120" height="5" fill="#B06000"/>

  <g id="cover-lead">
    <text x="100" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#22313A">
      <tspan x="100" dy="0">Un moteur mathématique inédit qui transforme le signal d'alarme</tspan>
      <tspan x="100" dy="38">humain, souvent une réaction de panique, en une décision</tspan>
      <tspan x="100" dy="38">quantifiée, comparable et <tspan font-weight="700" fill="#2C5F7C">auditable</tspan>.</tspan>
    </text>
  </g>

  <line x1="100" y1="548" x2="1180" y2="548" stroke="#D8DEE3" stroke-width="1"/>

  <g id="cover-stats">
    <text x="100" y="616" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#2C5F7C">1614</text>
    <text x="100" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7A85">tests automatisés</text>

    <text x="460" y="616" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#2C5F7C">94%</text>
    <text x="460" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7A85">couverture de code</text>

    <text x="820" y="616" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#2C5F7C">6</text>
    <text x="820" y="646" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#6B7A85">
      <tspan x="820" dy="0">méthodes MCDA &amp; stochastiques</tspan>
      <tspan x="820" dy="22">réconciliées en un seul moteur</tspan>
    </text>
  </g>

  <g id="cover-footer">
    <text x="100" y="694" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9AA5AC">John Hoarau</text>
    <text x="1180" y="694" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#9AA5AC" text-anchor="end">Soutenance de thèse · 2026</text>
  </g>
</svg>
