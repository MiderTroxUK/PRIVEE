    <text x="164" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#22313A">
      <tspan x="164" dy="0"><tspan font-weight="700" fill="#B06000">Ce qui est nouveau :</tspan> la première couche de traduction</tspan>
      <tspan x="164" dy="30">mathématique entre perception et réalité : un moteur</tspan>
      <tspan x="164" dy="30">d'adéquation <tspan font-weight="700">asymétrique</tspan>, pas un simple tableau de bord.</tspan>
    </text>
  </g>

  <g id="p03-citation">
    <text x="140" y="663" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9AA5AC">Réf. : Zhu et al. (2018) ; Rusou, Amar &amp; Ayal (2020) · biais de sur-priorisation (revue littérature BST §3.2)</text>
