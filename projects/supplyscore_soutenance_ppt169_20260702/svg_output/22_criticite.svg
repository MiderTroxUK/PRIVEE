<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="p22-header">
    <text x="56" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6B7A85">PARTIE III · DÉMONSTRATION 6/8</text>
    <text x="54" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#1E4258">Quel fournisseur ferait le plus mal s'il tombait ?</text>
    <rect x="56" y="118" width="64" height="4" fill="#2C5F7C"/>
  </g>

  <g id="p22-figure">
    <text x="76" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9AA5AC">Écran /simulation · criticité systématique</text>
    <image href="../images/16-simulation-criticite-pleine-page.png" x="76" y="170" width="283" height="480" preserveAspectRatio="xMidYMid meet"/>
    <rect x="76" y="170" width="283" height="480" fill="none" stroke="#D8DEE3" stroke-width="1"/>
  </g>

  <g id="p22-content">
    <text x="400" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#22313A">
      <tspan x="400" dy="0">ServiceCriticite simule une défaillance totale sur</tspan>
      <tspan x="400" dy="26">chaque nœud actif et mesure l'impact propagé</tspan>
      <tspan x="400" dy="26">jusqu'au client final : un tri-classement objectif.</tspan>
    </text>

    <rect x="400" y="320" width="824" height="72" fill="#F4F6F8" stroke="#D8DEE3"/>
    <text x="420" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1E4258">Tri : 1) delta_ur_final ↓  2) delta_ur_max ↓  3) nom ↑</text>
    <text x="420" y="372" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6B7A85">Nœuds déjà saturés (Ur≥1.0) → delta=0, relégués en bas</text>

    <text x="400" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B7A85">Δ FINAL (CLIENT)</text>
    <text x="400" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" fill="#2C5F7C">0.42</text>

    <text x="684" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B7A85">Δ MAX (RÉSEAU)</text>
    <text x="684" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" fill="#2C5F7C">0.60</text>

    <text x="968" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B7A85">NŒUDS IMPACTÉS</text>
    <text x="968" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" fill="#2C5F7C">2</text>

    <text x="400" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#22313A">
      <tspan x="400" dy="0">Exemple : la défaillance simulée du <tspan font-weight="700">Nœud 2</tspan></tspan>
      <tspan x="400" dy="26">propage +0.42 jusqu'au client final,</tspan>
      <tspan x="400" dy="26">priorité d'audit de résilience.</tspan>
    </text>
  </g>

  <g id="p22-footer">
    <line x1="56" y1="676" x2="1224" y2="676" stroke="#D8DEE3" stroke-width="1"/>
    <text x="56" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9AA5AC">SupplyScore · Soutenance de thèse</text>
    <text x="640" y="700" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#9AA5AC">supplyscore/services/criticite.py · ServiceCriticite</text>
    <text x="1224" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9AA5AC" text-anchor="end">22 / 28</text>
  </g>
</svg>
