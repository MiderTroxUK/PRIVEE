<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="p26-header">
    <text x="56" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6B7A85">PARTIE IV · SYNTHÈSE</text>
    <text x="54" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#1E4258">De la surveillance passive à la recommandation active</text>
    <rect x="56" y="118" width="64" height="4" fill="#2C5F7C" />
  </g>

  <line x1="640" y1="160" x2="640" y2="590" stroke="#D8DEE3" stroke-width="1" />

  <g id="p26-detection">
    <text x="76" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E4258">Détection de patterns cognitifs</text>

    <rect x="76" y="204" width="540" height="112" fill="#F4F6F8" stroke="#D8DEE3" />
    
  <g transform="translate(96, 220)" fill="none" stroke="#B06000" stroke-width="2">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
    <text x="130" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E4258">Coordinateur paniqué</text>
    <text x="96" y="266" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#22313A">Δ_panic = Ud − Ur ≥ 0.50</text>
    <text x="96" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6B7A85">sans retard opérationnel réel</text>

    <rect x="76" y="328" width="540" height="112" fill="#F4F6F8" stroke="#D8DEE3" />
    
  <g transform="translate(96, 344)" fill="none" stroke="#B3261E" stroke-width="2">
    <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
    <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" />
  </g>
    <text x="130" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E4258">Goulot silencieux</text>
    <text x="96" y="390" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#22313A">Δ_silent = Ur − Ud ≥ 0.50</text>
    <text x="96" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6B7A85">avec glissement de jalon actif</text>

    <text font-size="15" fill="#6B7A85" font-family="Segoe UI, Arial, sans-serif" x="76" y="474">Réseaux temporels (TGN) + LSTM sur l'historique</text><text font-size="15" fill="#6B7A85" font-family="Segoe UI, Arial, sans-serif" x="76" y="494">Effet Bullwhip : pics de Ud client amplifiés en amont</text></g>

  <g id="p26-agent">
    <text x="660" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1E4258">Agent de décision (MDP)</text>

    <text x="660" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#22313A"><tspan font-weight="700" fill="#2C5F7C">État S</tspan> : Ud, Ur, A, marges de jalons</text>
    <text x="660" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#22313A"><tspan font-weight="700" fill="#2C5F7C">Action A</tspan> : activer backup, expédier, ajuster jalon</text>
    <text x="660" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#22313A"><tspan font-weight="700" fill="#2C5F7C">Transition P(s'|s,a)</tspan> : simulation Monte Carlo sous décision</text>

    <text x="660" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6B7A85">Récompense : maximiser l'adéquation, minimiser le coût</text>
    <image href="data:image/png;base64," x="660" y="324.19" width="360" height="69.61" />

    <text font-size="15" fill="#6B7A85" font-family="Segoe UI, Arial, sans-serif" x="660" y="450">Exécution agentique : raisonneur LLM (ReAct)</text><text font-size="15" fill="#6B7A85" font-family="Segoe UI, Arial, sans-serif" x="660" y="470">appelant SupplyScoreService pour simuler chaque option</text></g>

  <g id="p26-shift">
    <text x="640" y="616" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#2C5F7C">
      Suivi passif → Classification active → Guidage autonome
    </text>
  </g>

  <g id="p26-citation">
    <text x="640" y="646" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9AA5AC">Réf. : Sterman (1989), Management Science · sous-réaction aux signaux amont (effet bullwhip)</text>
  </g>

  <g id="p26-footer">
    <line x1="56" y1="676" x2="1224" y2="676" stroke="#D8DEE3" stroke-width="1" />
    <text x="56" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9AA5AC">SupplyScore · Soutenance de thèse</text>
    <text x="1224" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9AA5AC" text-anchor="end">26 / 28</text>
  </g>
</svg>