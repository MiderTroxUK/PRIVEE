<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="p12-header">
    <text x="56" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6B7A85">PARTIE II · DEEP DIVE 4/6 · MONTE CARLO</text>
    <text x="54" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#1E4258">Simuler plutôt qu'approximer</text>
    <rect x="56" y="118" width="64" height="4" fill="#2C5F7C"/>
  </g>

  <g id="p12-figure">
    <image href="../images/06-simulation-pleine-page.png" x="76" y="150" width="310" height="460" preserveAspectRatio="xMidYMid meet"/>
    <rect x="76" y="150" width="310" height="460" fill="none" stroke="#D8DEE3" stroke-width="1"/>
    <text x="76" y="634" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6B7A85">
      <tspan x="76" dy="0">10 000 tirages en ordre topologique,</tspan>
      <tspan x="76" dy="22">intervalle de confiance à 95%</tspan>
    </text>
  </g>

  <g id="p12-content">
    <text x="420" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#22313A">
      <tspan x="420" dy="0">Le maximum de plusieurs lois lognormales n'est</tspan>
      <tspan x="420" dy="26">pas lognormal, PERT classique approxime mal.</tspan>
      <tspan x="420" dy="26">SupplyScore simule directement, nœud par nœud.</tspan>
    </text>

    <use data-icon="tabler-outline/dice-5" x="420" y="270" width="22" height="22" fill="#2C5F7C" stroke-width="2"/>
    <text x="450" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#22313A">Lognormale · Normale (tronquée à 0) · Triangulaire</text>

    <text x="420" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6B7A85">Récurrence sur le DAG &amp; estimateur du retard</text>
    <image href="../images/f07_mc_recur.png" x="420" y="340" width="700" height="48" preserveAspectRatio="xMidYMid meet"/>

    <rect x="420" y="418" width="520" height="86" fill="#F4F6F8" stroke="#D8DEE3"/>
    <use data-icon="tabler-outline/server" x="440" y="434" width="26" height="26" fill="#2C5F7C" stroke-width="2"/>
    <text x="478" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E4258">Garde-fou : budget mémoire strict</text>
    <text x="478" y="480" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#22313A">N × n ≤ 5×10⁷ (défaut N = 10 000)</text>

    <rect x="420" y="524" width="700" height="128" fill="#FFFFFF" stroke="#D8DEE3"/>
    <text x="440" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E4258">Exemple : 2 nœuds en série, tirage k=1</text>
    <text x="440" y="580" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#22313A">L₁~Lognorm(m=5h,s=1h) → L₁≈5.02h</text>
    <text x="440" y="604" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#22313A">L₂~Normale(m=4h,s=2h,tronquée) → L₂≈1.70h</text>
    <text x="440" y="628" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#1D7A3E">C₂=L₁+L₂=6.72h ≤ d₂=12h → pas de retard</text>
  </g>

  <g id="p12-footer">
    <line x1="56" y1="676" x2="1224" y2="676" stroke="#D8DEE3" stroke-width="1"/>
    <text x="56" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9AA5AC">SupplyScore · Soutenance de thèse</text>
    <text x="640" y="700" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#9AA5AC">supplyscore/mc/lead_time.py · SimulateurLeadTime</text>
    <text x="1224" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9AA5AC" text-anchor="end">12 / 28</text>
  </g>
</svg>
