    <text x="160" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6B7A85">AHP, F-BWM, PROMETHEE II, Monte Carlo, propagation DAG, adéquation asymétrique</text>
    <text x="1180" y="326" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#9AA5AC">P08-P16</text>
    <line x1="56" y1="392" x2="1224" y2="392" stroke="#D8DEE3" stroke-width="1"/>
  </g>

  <g id="p04-row3">
    <text x="76" y="456" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#2C5F7C">III</text>
    <text x="160" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#22313A">Huit démonstrations opérationnelles</text>
    <text x="160" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6B7A85">Du cycle hebdomadaire aux exports : le logiciel en fonctionnement réel</text>
    <text x="1180" y="446" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#9AA5AC">P17-P24</text>
    <line x1="56" y1="512" x2="1224" y2="512" stroke="#D8DEE3" stroke-width="1"/>
  </g>

