<rect id="turn-6" x="381.78" y="0" width="60.63" height="26" fill="#E9E9ED"/>
<rect id="turn-7" x="445.41" y="0" width="60.63" height="26" fill="#E9E9ED"/>
<rect id="turn-8" x="509.04" y="0" width="60.63" height="26" fill="#063C67"/>
<rect id="turn-9" x="572.67" y="0" width="60.63" height="26" fill="#E9E9ED"/>
