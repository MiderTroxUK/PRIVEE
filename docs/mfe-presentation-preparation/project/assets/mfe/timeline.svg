<path d="M30.3 26 V31 M93.9 26 V31 M157.6 26 V31 M221.2 26 V31 M284.8 26 V31 M348.5 26 V31 M412.1 26 V31 M475.7 26 V31 M602.9 26 V31 M666.6 26 V31 M730.2 26 V31 M793.9 26 V31 M857.5 26 V31 M921.1 26 V31 M984.8 26 V31 M1048.4 26 V31 M1112.0 26 V31 M1175.7 26 V31"/>
</g>
<path id="tick-8" d="M539.4 26 V33" stroke="#063C67" stroke-width="2"/>

<g id="turn-labels" font-size="16" fill="#858591" text-anchor="middle">
<text id="label-t0" x="30.3" y="47">T0</text>
<text id="label-t5" x="348.5" y="47">T5</text>
