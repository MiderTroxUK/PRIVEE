<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1206 52" preserveAspectRatio="xMidYMid meet" width="1206" height="52" role="img" aria-labelledby="timeline-title timeline-desc" font-family="Arial,Arimo,sans-serif">
<title id="timeline-title">The campaign timeline, turns T0 to T18</title>
<desc id="timeline-desc">Nineteen turns. The first six carry a sharp signal. From turn six the crisis is public and the gap closes. At turn eight the satellite prime misses its milestone.</desc>

<!-- 19 cells on a 63.63 pitch: the ochre run ends where the card above it ends (6/19). -->
<g id="turn-cells">
