<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="p20-header">
    <text x="56" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6B7A85">PARTIE III · DÉMONSTRATION 4/8</text>
    <text x="54" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#1E4258">WAL, intégrité vérifiée, 20 sauvegardes en rotation</text>
    <rect x="56" y="118" width="64" height="4" fill="#2C5F7C"/>
  </g>

  <g id="p20-figure">
    <image href="../images/11-admin.png" x="260" y="158" width="760" height="372" preserveAspectRatio="xMidYMid meet"/>
    <rect x="260" y="158" width="760" height="372" fill="none" stroke="#D8DEE3" stroke-width="1"/>
  </g>

  <g id="p20-analysis">
    <rect x="56" y="550" width="373" height="96" fill="#F4F6F8" stroke="#D8DEE3"/>
    <use data-icon="tabler-outline/shield-check" x="72" y="562" width="24" height="24" fill="#2C5F7C" stroke-width="2"/>
    <text x="104" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E4258">WAL + intégrité</text>
    <text x="72" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6B7A85">
      <tspan x="72" dy="0">journal_mode=WAL,</tspan>
      <tspan x="72" dy="18">integrity_check avant copie</tspan>
    </text>

    <rect x="453" y="550" width="373" height="96" fill="#F4F6F8" stroke="#D8DEE3"/>
    <use data-icon="tabler-outline/database-export" x="469" y="562" width="24" height="24" fill="#2C5F7C" stroke-width="2"/>
    <text x="501" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E4258">Sauvegarde native</text>
    <text x="469" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6B7A85">
      <tspan x="469" dy="0">sqlite3.backup : copie</tspan>
      <tspan x="469" dy="18">transactionnelle, sans verrou</tspan>
    </text>

    <rect x="850" y="550" width="373" height="96" fill="#F4F6F8" stroke="#D8DEE3"/>
    <use data-icon="tabler-outline/clock" x="866" y="562" width="24" height="24" fill="#2C5F7C" stroke-width="2"/>
    <text x="898" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1E4258">Rotation automatique</text>
    <text x="866" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6B7A85">
      <tspan x="866" dy="0">Toutes les 24h,</tspan>
      <tspan x="866" dy="18">rétention de 20 archives zip</tspan>
    </text>
  </g>

  <g id="p20-footer">
    <line x1="56" y1="676" x2="1224" y2="676" stroke="#D8DEE3" stroke-width="1"/>
    <text x="56" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9AA5AC">SupplyScore · Soutenance de thèse</text>
    <text x="640" y="700" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#9AA5AC">supplyscore/data/backup.py · migrations.py</text>
    <text x="1224" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9AA5AC" text-anchor="end">20 / 28</text>
  </g>
</svg>
