  <g id="p06-code">
    <rect x="610" y="400" width="614" height="222" fill="#1E4258"/>
    <text x="634" y="432" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#FFFFFF">
      <tspan x="634" dy="0" fill="#9FB6C6">-- registry.sqlite --</tspan>
      <tspan x="634" dy="24">CREATE TABLE nodes (id, name, rank,</tspan>
      <tspan x="634" dy="22">  kpis_json, status ...);</tspan>
      <tspan x="634" dy="24">CREATE TABLE arcs (source_id, target_id,</tspan>
      <tspan x="634" dy="22">  gamma, beta, delta ...);</tspan>
      <tspan x="634" dy="26" fill="#9FB6C6">-- &lt;client_id&gt;.sqlite --</tspan>
      <tspan x="634" dy="24">CREATE TABLE assessments, weekly_reviews,</tspan>
      <tspan x="634" dy="22">  kpi_snapshots, audit_log ...</tspan>
    </text>
  </g>

