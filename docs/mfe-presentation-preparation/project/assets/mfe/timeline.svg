<rect id="turn-12" x="763.56" y="0" width="60.63" height="26" fill="#E9E9ED"/>
<rect id="turn-13" x="827.19" y="0" width="60.63" height="26" fill="#E9E9ED"/>
<rect id="turn-14" x="890.82" y="0" width="60.63" height="26" fill="#E9E9ED"/>
<rect id="turn-15" x="954.45" y="0" width="60.63" height="26" fill="#E9E9ED"/>
<rect id="turn-16" x="1018.08" y="0" width="60.63" height="26" fill="#E9E9ED"/>
